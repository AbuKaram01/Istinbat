  <rect x="96" y="88" width="320" height="336" rx="36" fill="#ffffff"/>
  <!-- Open book -->
  <g fill="#3f51b5" stroke="#3f51b5" stroke-width="14" stroke-linejoin="round"
     transform="translate(256 228) scale(1.15) translate(-256 -228)">
    <polygon points="180,172 246,190 246,278 180,260"/>
    <polygon points="332,172 266,190 266,278 332,260"/>
  </g>
  <!-- Answer lines -->
  <rect x="160" y="336" width="192" height="24" rx="12" fill="#3f51b5"/>
  <rect x="192" y="376" width="128" height="24" rx="12" fill="#3f51b5"/>
</svg>
