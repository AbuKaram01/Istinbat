[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "istinbat"
version = "0.1.0"
description = "Ask questions about your Arabic books and get answers drawn from their text, fully offline."
readme = "README.md"
authors = [{ name = "AbuKaram01" }]
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "chromadb",
    "sentence-transformers",
    "rank-bm25",
    "markdown-it-py",
    "llama-cpp-python",
    # PyGObject is best installed as a system package (python3-gi): it binds to the
    # system GTK/GObject-Introspection libraries, which pip alone cannot provide.
    # On Windows there is no wheel on PyPI and the sdist cannot be built by pip alone; the
    # gvsbuild-built wheel is installed by scripts/install-windows.ps1 instead.
    "PyGObject; sys_platform != 'win32'",
]

[project.scripts]
istinbat = "istinbat.gui.application:main"

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
istinbat = ["i18n/locales/*.json", "gui/style.css"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# PyGObject requires gi.require_version() to run before `from gi.repository import ...`.
"src/istinbat/gui/*" = ["E402"]
"tests/gui_support.py" = ["E402"]
"tests/test_gui.py" = ["E402"]
"tests/test_gui_downloads.py" = ["E402"]
"tests/test_gui_welcome.py" = ["E402"]
"tests/test_gui_library_delete.py" = ["E402"]
"tests/test_markdown_view.py" = ["E402"]
"scripts/*" = ["E402"]
# Windows environment variable names are case-insensitive; the scan spells them the way Windows does.
"packaging/windows/dlls.py" = ["SIM112"]
"tests/test_winsupport.py" = ["SIM112"]
